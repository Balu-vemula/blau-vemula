name: Building Docker Image For Cypress and Running It

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: docker/setup-buildx-action@v1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: node -v

      - name: Build Docker Image
        run: docker build -f dockerfile -t wm-test-cypress-image .
      

      - name: Run smoke
        run: docker run -it  -v ${GITHUB_WORKSPACE}/cypress.config.js:app/cypress.config.js wm-test-cypress-image